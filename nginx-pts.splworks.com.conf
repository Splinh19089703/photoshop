# Cấu hình Nginx Reverse Proxy cho FastPanel (pts.splworks.com)
# Đường dẫn code trên VPS: /var/www/pts_spl/data/www/pts.splworks.com
#
# Trong FastPanel -> mở site pts.splworks.com -> Manual Configuration (Nginx)
# thêm hoặc thay block location / bằng cấu hình bên dưới:

client_max_body_size 50M;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/wasm application/javascript text/javascript text/css text/html application/json;

location / {
    proxy_pass http://127.0.0.1:4242;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
